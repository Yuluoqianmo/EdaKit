ar(--teal);box-shadow:inset 0 -2px var(--teal);font-weight:600}.preview{position:relative;min-height:150px;flex:1;background-color:#fbfcfd;background-image:radial-gradient(#dae3e9 .7px,transparent .7px);background-size:13px 13px;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview svg{width:76%;height:76%;max-height:280px}.canvas-label{position:absolute;bottom:12px;font-size:10px;color:#a1afb9}.previewtools{display:flex;align-items:center;padding:9px 12px;border-top:1px solid var(--line);gap:8px;font-size:11px;color:var(--muted)}.previewtools button{border:0;padding:3px 6px;background:none}.previewtools button:last-child{margin-left:auto}.detailbottom{padding:10px 15px;border-top:1px solid var(--line);font-size:10px;color:#8597a4}.statusbar{height:30px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 15px;font-size:10px;color:#8a9ba7;gap:20px}.statusbar span:last-child{margin-left:auto}.toast{position:fixed;right:25px;bottom:45px;background:#fff;border:1px solid #d8e4e7;border-radius:5px;box-shadow:0 5px 24px #1834481c;width:330px;padding:14px 16px;z-index:20;display:none}.toast strong{font-size:12px;font-weight:500}.toast p{font-size:11px;color:#8699a6;line-height:1.8;margin:6px 0}.toast button{float:right;border:0;font-size:11px;padding:0;color:var(--teal)}.progress{height:3px;background:#e7f2f2;margin-top:12px;overflow:hidden}.progress i{display:block;height:3px;width:30%;background:var(--teal);animation:slide 1.6s infinite ease-in-out}.skeleton{height:10px;display:block;border-radius:3px;background:#e9eef2;animation:pulse 1.2s infinite alternate;min-width:35px}.skeleton.long{width:85%;margin-bottom:9px}.failure,.noresults{padding:45px 20px;text-align:center;color:#8093a0;font-size:12px;line-height:2}.failure b{color:#9b6549;font-weight:500}.failure button{margin-top:10px}.previewwait{position:absolute;inset:0;background:#fbfcfdee;display:none;align-items:center;justify-content:center;flex-direction:column;color:var(--teal);gap:12px;font-size:12px}.spinner{width:22px;height:22px;border:2px solid #d5e7e6;border-top-color:var(--teal);border-radius:50%;animation:spin .9s linear infinite}.modal{position:fixed;inset:0;background:#19334888;z-index:50;display:none;align-items:center;justify-content:center}.modal.open{display:flex}.modalbox{width:min(880px,90vw);height:75vh;background:white;border-radius:6px;display:flex;flex-direction:column}.modalhead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal .preview{min-height:0}.mobcat{display:none}.pulse-note{color:#996b2a!important}@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(430%)}}@keyframes pulse{to{opacity:.45}}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:1700px){.inspector{width:390px}.sidebar{width:200px}.fields{gap:18px}}@media(max-width:1200px){.sidebar{width:148px}.inspector{width:285px}.workspace{padding:10px;gap:10px}.filters{padding:12px 14px 0}.fields{gap:8px;grid-template-columns:repeat(5,minmax(75px,1fr))}th,td{padding:10px 8px}.optcol{display:none}.searchbar small{display:none}.specs{gap:8px}.detailtop{padding:12px}.layout{height:calc(100vh - 182px)}}@media(max-width:850px){.sidebar{display:none}.inspector{width:265px}.fields{grid-template-columns:repeat(3,1fr)}.fields .field:nth-child(n+4){display:none}.extra .field{display:block!important}.workspace{gap:8px;padding:8px}.breadcrumb{margin-bottom:8px}.searchbar{padding:12px}.demo{padding:0 12px;gap:7px}.demo b{display:none}.dirty{margin-left:0}.selectionbar{gap:5px}.searchbar .reset{display:none}.mobcat{display:inline-block}.statusbar{gap:8px}.statusbar span:nth-child(2){display:none}.detailtop{padding:10px}.specs{margin:12px 0}h2{font-size:15px}}@media(max-width:600px){header{padding:0 12px}.connection{font-size:10px!important}.searchbar{height:64px;gap:7px}.layout{height:auto;min-height:calc(100vh - 176px)}.workspace{flex-direction </style></head><body>
<header><strong>EdaKit</strong><span>元件工作台</span><span class="connection">● Capture 已连接（演示）</span></header>
<div class="demo"><b>交互设计原型 · 示例数据</b><span class="demohelp">筛选与等待状态可操作，不连接商城或 Capture</span><label>查询演示 <select id="scenario"><option value="normal">正常返回</option><option value="slow">慢响应</option><option value="error">查询失败</option><option value="empty">无匹配结果</option></select></label></div>
<div class="searchbar"><div class="searchbox"><span aria-hidden="true">⌕</span><input id="keyword" aria-label="搜索器件" value="4.7K" placeholder="搜索型号、C 编号，或输入阻值 / 容值"></div><button class="primary" id="query">查询</button><button class="reset" id="reset">重置</button><small>选好条件，再查询 · Enter 提交</small></div>
<div class="layout"><aside class="sidebar"><div class="rail-title">器件分类</div><div id="categorylist"></div><div class="rail-note">分类决定可用参数<br>同一属性多选为“或”<br>不同属性之间为“且”</div></aside>
<main class="main"><section class="filters"><div class="breadcrumb"><select id="mobilecategory" class="mobcat" aria-label="器件分类"></select><span id="crumb">电阻 / <strong>贴片电阻</strong></span><button class="textbutton" id="more">更多参数 ↓</button></div><div class="fields" id="fields"></div><div class="fields extra" id="extra"></div><div class="selectionbar"><span class="label">已选条件</span><div id="chips" style="display:contents"></div><button class="textbutton" id="clearfilters" style="font-size:11px">清空筛选</button><span id="dirty" class="dirty"></span></div></section>
<div class="workspace"><section class="results"><div class="resultbar">搜索结果 <small id="total"></small><select id="sort" aria-label="排序"><option value="stock">库存优先</option><option value="price">单价升序</option></select></div><div class="applied" id="applied"></div><div class="tablewrap" id="tablewrap"><table><thead><tr><th>型号 / 编号</th><th>品牌</th><th>封装</th><th id="valuehead">阻值</th><th class="optcol">精度</th><th>库存</th></tr></thead><tbody id="rows"></tbody></table><div id="emptystate"></div></div><div class="pagination"><button id="prev" aria-label="上一页">‹</button><button class="page-number" id="pageno">1</button><button id="next" aria-label="下一页">›</button><span id="pagesummary"></span></div></section>
<aside class="inspector"><div class="detailtop"><div class="detailmeta"><b id="cid"></b><span id="detailstock"></span></div><h2 id="model"></h2><div class="manufacturer" id="brand"></div><div class="specs" id="specs"></div><div class="actions"><button class="primary" id="place">放置</button><a href="#" id="datasheet">数据手册 ↗</a></div></div><div class="tabs"><button data-tab="footprint" class="active">PCB 封装</button><button data-tab="symbol">原理图</button><button data-tab="3d">3D 模型</button></div><div class="preview" id="preview"><div id="drawing" style="display:contents"></div><span class="canvas-label" id="canvaslabel">尺寸单位 mm · 示例预览</span><div class="previewwait" id="previewwait"><i class="spinner"></i><span>正在生成预览</span></div></div><div class="previewtools"><button id="zoomout" aria-label="缩小">−</button><span id="zoomlabel">100%</span><button id="zoomin" aria-label="放大">＋</button><button id="fit">适应</button><button id="large">放大查看 ↗</button></div><div class="detailbottom">单击查看详情 · 双击器件模拟放置</div></aside></div></main></div>
<footer class="statusbar"><span>● 本地预览服务 · 演示</span><span id="footstatus">查询完成</span><span>所有数量、价格、模型均为原型示例</span></footer>
<div class="toast" id="toast" role="status" aria-live="polite"><button id="cancel">取消</button><strong id="tasktitle"></strong><p id="tasksub"></p><div class="progress"><i></i></div></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><span id="largetitle">封装预览</span><button id="closelarge">关闭 · Esc</button></div><div class="preview" id="largedrawing"></div></div></div>
<script src="prototype.js"></script></body></html>
