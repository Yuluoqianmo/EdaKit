name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.lock
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tcl
      - run: python -m ruff check src/edakit --select F401,F841,B023 --exclude reference.py
      - run: python -m pytest -q
