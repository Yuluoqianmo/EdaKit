<!DOCTYPE html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>UA INFO 2</title>
</head>
<body style="font:16px 'Microsoft YaHei',Arial; padding:20px">
<h3>Embedded browser info (with X-UA-Compatible IE=edge)</h3>
<div id="out">checking...</div>
<img id="svgimg" style="border:1px solid #ccc;margin-top:12px"
     alt="svg-in-img test" width="160" height="80"
     src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22160%22%20height%3D%2280%22%3E%3Crect%20x%3D%2210%22%20y%3D%2210%22%20width%3D%22140%22%20height%3D%2260%22%20fill%3D%22%23c33%22%2F%3E%3C%2Fsvg%3E">
<p id="svgtxt">(the red box above is an inline SVG-in-img test)</p>
<script>
var ua = navigator.userAgent;
var dmode = "n/a";
try { if (document.documentMode) dmode = document.documentMode; } catch (e) {}
var feats = [];
feats.push("fetch=" + (typeof fetch !== "undefined"));
feats.push("Promise=" + (typeof Promise !== "undefined"));
feats.push("JSON=" + (typeof JSON !== "undefined"));
feats.push("XMLHttpRequest=" + (typeof XMLHttpRequest !== "undefined"));
feats.push("querySelectorAll=" + (!!document.querySelectorAll));
feats.push("addEventListener=" + (!!window.addEventListener));
feats.push("attachEvent=" + (!!window.attachEvent));
feats.push("SVG=" + (!!document.createElementNS && !!document.createElementNS("http://www.w3.org/2000/svg","svg").createSVGRect));
feats.push("canvas=" + (!!document.createElement("canvas").getContext));
feats.push("dialog=" + (typeof document.createElement("dialog").showModal === "function"));
feats.push("flex=" + (typeof document.createElement("div").style.flex !== "undefined"));
feats.push("borderRadius=" + (typeof document.createElement("div").style.borderRadius !== "undefined"));
var img = document.getElementById("svgimg");
feats.push("svgImg.complete=" + img.complete + " naturalWidth=" + (img.naturalWidth || img.width));
var html = "UserAgent: " + ua + "<br>documentMode: " + dmode + "<br><br>" + feats.join("<br>");
document.getElementById("out").innerHTML = html;
</script>
</body>
</html>
